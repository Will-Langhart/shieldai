name: ci

# Fast checks every PR must pass. main's ruleset requires these jobs by name,
# which makes them (with Preview e2e) the reviewer for agent PRs.
# ci-cd.yml (deploys) stays as it was; these are the jobs the ruleset requires.

on:
  push:
    branches: [main]
  pull_request:
  # flag-watch.yml starts the required checks on its rollback branches this way,
  # since PRs opened with the workflow token don't trigger pull_request runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    name: Agent rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # the production schema snapshot for the migration dry run
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/claude-agent/scripts/*.test.mjs
      - run: node .github/claude-agent/scripts/roadmap.mjs check

      # A PR's new migrations must apply cleanly to a throwaway local Supabase
      # database loaded with production's schema before the PR can merge.
      # No-op when the PR adds none. db-dryrun.mjs explains when it skips.
      - name: Production schema snapshot
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/claude-agent/scripts/db-snapshot.sh "$RUNNER_TEMP/prod-schema.sql"
      - name: Migration dry run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DB_SCHEMA_FILE: ${{ runner.temp }}/prod-schema.sql
          DB_AUTO_APPLY: ${{ vars.DB_AUTO_APPLY }}
        run: node .github/claude-agent/scripts/db-dryrun.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run type-check --workspace src/apps/web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace src/apps/web

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test --workspace src/apps/web

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace src/apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
